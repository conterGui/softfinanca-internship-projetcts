<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seleção de notas</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="container">
        <h1>Levantar</h1>

        <div class="notesInput" id="notesInput">
          <input
            type="number"
            placeholder="Quantia a levantar"
            id="amount"
          />
          <span class="icon">EUR</span>
        </div>

        <span id="maxMessage" class="maxMessage"></span>

        <button class="personalize" id="personalize">
          Personalizar quantia
        </button>
      </section>

      <section class="notesOptions">
        <ul class="notesGroup" id="notesGroup"></ul>
      </section>
    </main>

    <footer>
      <button class="continue unavailable" id="confirm" type="button">
        Confirmar
      </button>
    </footer>
  </body>
</html>
